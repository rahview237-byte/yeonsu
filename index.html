<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>불안 기록 저널</title>
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- SheetJS (xlsx) for Excel Export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f7f4f1;
    margin: 0;
    padding: 20px;
    color: #3a332e;
  }
  
  /* Lock Screen Overlay */
  .lock-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(247, 244, 241, 0.97);
    backdrop-filter: blur(10px);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lock-card {
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(91,70,54,0.1);
    border: 1px solid #eae2d9;
  }
  .lock-icon {
    font-size: 42px;
    margin-bottom: 12px;
  }
  .lock-card h2 {
    font-size: 20px;
    color: #5b4636;
    margin: 0 0 6px 0;
  }
  .lock-card p {
    font-size: 13px;
    color: #948578;
    margin: 0 0 20px 0;
  }
  .lock-card input[type="password"] {
    width: 100%;
    border: 1px solid #e3dcd4;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 14px;
    background: #faf8f5;
    outline: none;
  }
  .lock-card input[type="password"]:focus {
    border-color: #b3714f;
    background: #fff;
  }
  .lock-card button {
    width: 100%;
    background: #b3714f;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .lock-card button:hover { background: #a06040; }
  .error-msg {
    color: #d96b6b;
    font-size: 12px;
    font-weight: 600;
    margin-top: 10px;
    min-height: 18px;
  }

  /* Main Container */
  .container { max-width: 500px; margin: 0 auto; display: none; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px 0;
    color: #5b4636;
  }
  .subtitle {
    font-size: 13px;
    color: #948578;
  }
  .lock-btn {
    background: #e6dfd5;
    color: #5b4636;
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .lock-btn:hover { background: #dcd3c6; }
  
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(91,70,54,0.06);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #6b5d50;
  }
  textarea, input[type="text"], select {
    width: 100%;
    border: 1px solid #e3dcd4;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 14px;
    resize: vertical;
    background: #faf8f5;
    color: #3a332e;
  }
  textarea:focus, input[type="text"]:focus, select:focus {
    outline: none;
    border-color: #b3714f;
    background: #fff;
  }
  textarea { min-height: 60px; }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  input[type="range"] { flex: 1; accent-color: #b3714f; }
  .slider-value {
    font-weight: 700;
    color: #b3714f;
    width: 24px;
    text-align: center;
  }
  .btn-primary {
    width: 100%;
    background: #b3714f;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .btn-primary:hover { background: #a06040; }
  .btn-primary:active { opacity: 0.85; }
  
  .btn-action-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .btn-excel {
    flex: 1;
    background: #217346;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-excel:hover { background: #1a5c37; }

  .btn-copy {
    flex: 1;
    background: #8a7a6c;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-copy:hover { background: #77685b; }

  .btn-refresh {
    background: #e8dfd5;
    color: #5b4636;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-refresh:hover { background: #dcd1c4; }

  .entry {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    border-left: 4px solid #b3714f;
    position: relative;
  }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  /* Dynamic Calendar Badge */
  .entry-date-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dynamic-calendar {
    width: 34px;
    height: 36px;
    background: #fff;
    border: 1.5px solid #e3dcd4;
    border-radius: 8px;
    box-shadow: 0 2px 4px rgba(91,70,54,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .dynamic-calendar .cal-top {
    background: #b3714f;
    color: #ffffff;
    font-size: 8px;
    font-weight: 700;
    width: 100%;
    text-align: center;
    padding: 2px 0 1px;
    line-height: 1;
    letter-spacing: 0.5px;
  }
  .dynamic-calendar .cal-body {
    font-size: 14px;
    font-weight: 800;
    color: #4a3c31;
    line-height: 20px;
  }

  .entry-date {
    font-size: 12px;
    color: #a99a8c;
  }
  .entry-field {
    font-size: 13px;
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .entry-field b { color: #6b5d50; }
  .intensity-badge {
    display: inline-block;
    background: #f3e6dd;
    color: #b3714f;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .delete-btn {
    background: transparent;
    border: none;
    color: #d96b6b;
    font-size: 12px;
    cursor: pointer;
    padding: 2px 6px;
  }
  .delete-btn:hover { text-decoration: underline; }
  .empty-state {
    text-align: center;
    color: #b3a99d;
    font-size: 13px;
    padding: 30px 20px;
    background: #fff;
    border-radius: 12px;
    border: 1px dashed #e3dcd4;
  }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: #6b5d50;
    margin: 24px 0 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .status {
    font-size: 13px;
    font-weight: 600;
    color: #b3714f;
    text-align: center;
    margin-top: 10px;
    min-height: 20px;
  }
  .db-status-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 600;
    background: #e2f4e8;
    color: #2e7d32;
  }
</style>
</head>
<body>

<!-- Lock Screen Modal -->
<div id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h2>비밀번호 입력</h2>
    <p>저널 기록을 확인하려면 비밀번호를 입력해 주세요.</p>
    <input type="password" id="passwordInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()">확인</button>
    <div id="passwordError" class="error-msg"></div>
  </div>
</div>

<!-- Main Journal Container -->
<div class="container" id="appContainer">
  <div class="header">
    <div>
      <h1>불안 기록 저널</h1>
      <div class="subtitle">모든 기기에서 실시간 동기화되는 나만의 기록 공간</div>
    </div>
    <button class="lock-btn" onclick="lockJournal()">🔒 잠금</button>
  </div>

  <div class="card">
    <label>어떤 상황이었어?</label>
    <textarea id="situation" placeholder="예: 중요한 결과 발표를 기다리고 있음"></textarea>

    <label>그 순간 무슨 생각이 들었어?</label>
    <textarea id="thought" placeholder="예: 나를 떠날 것 같다는 생각이 들었음"></textarea>

    <label>불안 강도 (1~10)</label>
    <div class="slider-row">
      <input type="range" id="intensity" min="1" max="10" value="5">
      <div class="slider-value" id="intensityVal">5</div>
    </div>

    <label>어떻게 반응했어? (연락함/참음/다른 걸로 전환함 등)</label>
    <textarea id="action" placeholder="예: 계속 연락함"></textarea>

    <label>상대에게 확인(안심 요청)을 받았어?</label>
    <select id="confirmed">
      <option value="안 받음">안 받음 — 스스로 가라앉힘</option>
      <option value="받음">받음 — 상대에게 확인받음</option>
    </select>

    <label>확인 후 (또는 지금) 어땠어?</label>
    <textarea id="result" placeholder="예: 나아졌음 / 잠깐만 나아졌다가 다시 불안함 / 여전히 불안함"></textarea>

    <button class="btn-primary" onclick="saveEntry()">☁️ 데이터베이스에 기록하기</button>
    <div class="status" id="status"></div>
  </div>

  <div class="section-title">
    <span>지난 기록 목록</span>
    <div>
      <button class="btn-refresh" onclick="fetchEntries()">🔄 동기화</button>
      <span class="db-status-badge">🟢 Supabase DB 실시간 연결됨</span>
    </div>
  </div>

  <div class="btn-action-row">
    <button class="btn-excel" onclick="exportToExcel()">📊 엑셀 다운로드 (.xlsx)</button>
    <button class="btn-copy" onclick="exportToText()">📋 텍스트 복사</button>
  </div>
  
  <div id="entryList"></div>
</div>

<script>
const SUPABASE_URL = 'https://yltlaxtnpabmaiqrcsym.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsdGxheHRucGFibWFpcXJjc3ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MjgwNDgsImV4cCI6MjEwMjEwNDA0OH0.5QCjx7SqOJuW66J01ikWAtlb_l4tWLoH5s2UH0y0jDU';
const PASSCODE = 'mc302mc302*';

let entries = [];
const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// Lock & Authentication Functions
function checkPassword() {
  const input = document.getElementById('passwordInput').value;
  const errorEl = document.getElementById('passwordError');
  if (input === PASSCODE) {
    sessionStorage.setItem('journal_unlocked', 'true');
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
    errorEl.textContent = '';
    fetchEntries();
  } else {
    errorEl.textContent = '비밀번호가 올바르지 않습니다.';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
  }
}

function lockJournal() {
  sessionStorage.removeItem('journal_unlocked');
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('appContainer').style.display = 'none';
  document.getElementById('passwordInput').value = '';
  document.getElementById('passwordError').textContent = '';
  setTimeout(() => document.getElementById('passwordInput').focus(), 100);
}

function initAuth() {
  if (sessionStorage.getItem('journal_unlocked') === 'true') {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appContainer').style.display = 'block';
    fetchEntries();
  } else {
    document.getElementById('lockScreen').style.display = 'flex';
    document.getElementById('appContainer').style.display = 'none';
    setTimeout(() => document.getElementById('passwordInput').focus(), 100);
  }
}

const intensitySlider = document.getElementById('intensity');
const intensityVal = document.getElementById('intensityVal');
intensitySlider.addEventListener('input', () => {
  intensityVal.textContent = intensitySlider.value;
});

async function fetchEntries() {
  if (!supabaseClient || sessionStorage.getItem('journal_unlocked') !== 'true') return;

  try {
    const { data, error } = await supabaseClient
      .from('anxiety_journals')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;

    entries = (data || []).map(row => {
      const dt = row.created_at ? new Date(row.created_at) : new Date();
      return {
        id: row.id,
        monthNum: dt.getMonth() + 1,
        dayNum: dt.getDate(),
        date: dt.toLocaleString('ko-KR', { 
          year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' 
        }),
        situation: row.situation,
        thought: row.thought,
        intensity: row.intensity,
        action: row.action,
        confirmed: row.confirmed,
        result: row.result
      };
    });
    renderEntries();
  } catch (err) {
    console.error('Fetch Error:', err);
  }
}

function renderEntries() {
  const listEl = document.getElementById('entryList');
  if (!entries.length) {
    listEl.innerHTML = '<div class="empty-state">아직 기록된 항목이 없어</div>';
    return;
  }
  listEl.innerHTML = entries.map(e => `
    <div class="entry">
      <div class="entry-header">
        <div class="entry-date-container">
          <div class="dynamic-calendar">
            <div class="cal-top">${e.monthNum}월</div>
            <div class="cal-body">${e.dayNum}</div>
          </div>
          <span class="entry-date">${e.date}</span>
        </div>
        <div>
          <span class="intensity-badge">강도 ${e.intensity}</span>
          <button class="delete-btn" onclick="deleteEntry(${e.id})">삭제</button>
        </div>
      </div>
      <div class="entry-field"><b>상황</b> ${escapeHtml(e.situation)}</div>
      <div class="entry-field"><b>생각</b> ${escapeHtml(e.thought)}</div>
      <div class="entry-field"><b>반응</b> ${escapeHtml(e.action)}</div>
      <div class="entry-field"><b>확인 요청</b> ${escapeHtml(e.confirmed || '-')}</div>
      <div class="entry-field"><b>결과</b> ${escapeHtml(e.result || '-')}</div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function deleteEntry(id) {
  if (!confirm('이 기록을 삭제할까?')) return;

  if (supabaseClient) {
    try {
      const { error } = await supabaseClient.from('anxiety_journals').delete().eq('id', id);
      if (error) throw error;
    } catch (err) {
      alert('삭제 실패: ' + err.message);
      return;
    }
  }
  fetchEntries();
}

async function saveEntry() {
  const situation = document.getElementById('situation').value.trim();
  const thought = document.getElementById('thought').value.trim();
  const intensity = parseInt(document.getElementById('intensity').value, 10);
  const action = document.getElementById('action').value.trim();
  const confirmed = document.getElementById('confirmed').value;
  const result = document.getElementById('result').value.trim();
  const statusEl = document.getElementById('status');

  if (!situation && !thought) {
    statusEl.textContent = '상황이나 생각 중 하나는 적어줘';
    return;
  }

  statusEl.textContent = '☁️ Supabase DB에 저장하는 중...';

  if (supabaseClient) {
    try {
      const { error } = await supabaseClient
        .from('anxiety_journals')
        .insert([{ situation, thought, intensity, action, confirmed, result }]);

      if (error) throw error;

      statusEl.textContent = '✨ DB 저장 완료! 다른 기기에서도 확인 가능해.';
    } catch (err) {
      console.error('Save Error:', err);
      statusEl.textContent = '⚠️ DB 저장 실패: ' + err.message;
      return;
    }
  }

  document.getElementById('situation').value = '';
  document.getElementById('thought').value = '';
  document.getElementById('action').value = '';
  document.getElementById('result').value = '';
  document.getElementById('confirmed').value = '안 받음';
  intensitySlider.value = 5;
  intensityVal.textContent = 5;

  fetchEntries();
}

// Export to Excel (.xlsx)
function exportToExcel() {
  if (!entries.length) {
    alert('내보낼 기록이 없어');
    return;
  }
  
  if (!window.XLSX) {
    alert('엑셀 내보내기 라이브러리를 로드 중이야. 잠시 후 다시 시도해줘.');
    return;
  }

  const excelData = entries.map((e, index) => ({
    '번호': entries.length - index,
    '날짜': e.date,
    '불안 강도 (1~10)': e.intensity,
    '어떤 상황이었어?': e.situation,
    '무슨 생각이 들었어?': e.thought,
    '어떻게 반응했어?': e.action,
    '확인(안심 요청) 여부': e.confirmed,
    '확인 후 결과': e.result
  }));

  const worksheet = XLSX.utils.json_to_sheet(excelData);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "불안 기록 저널");

  // Auto column widths
  worksheet['!cols'] = [
    { wch: 6 },  // 번호
    { wch: 22 }, // 날짜
    { wch: 14 }, // 불안 강도
    { wch: 30 }, // 상황
    { wch: 30 }, // 생각
    { wch: 20 }, // 반응
    { wch: 18 }, // 확인 여부
    { wch: 30 }  // 결과
  ];

  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(workbook, `불안_기록_저널_${dateStr}.xlsx`);
}

// Export to Text Copy
function exportToText() {
  if (!entries.length) {
    alert('아직 기록된 항목이 없어');
    return;
  }
  const text = entries.map(e =>
    `[${e.date}] 강도 ${e.intensity}\n상황: ${e.situation}\n생각: ${e.thought}\n반응: ${e.action}\n확인 요청: ${e.confirmed}\n결과: ${e.result}\n`
  ).join('\n---\n');

  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    alert('전체 기록이 클립보드에 복사됐어! 메모장에 붙여넣기 해줘.');
  } catch (e) {
    alert('복사에 실패했어: \n\n' + text);
  }
  document.body.removeChild(textarea);
}

initAuth();

// 30초마다 자동으로 다른 기기의 최신 기록 불러오기 (자동 동기화)
setInterval(fetchEntries, 30000);
</script>
</body>
</html>
